<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Diagnóstico ESG</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="bg-login">
    <div class="box-login">
        <h2>Diagnóstico <span>ESG</span></h2>
        <p>Acesse o painel de sustentabilidade da sua empresa.</p>
        
        {% with msgs = get_flashed_messages() %}
          {% if msgs %}
            <div class="alerta">
              {% for msg in msgs %}
                <p>{{ msg }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="/">
            <div class="campo">
                <label for="email">E-mail corporativo</label>
                <input type="email" id="email" name="email" required placeholder="exemplo@empresa.com.br">
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-pri">Entrar no Sistema</button>
        </form>
    </div>
</body>
</html>
